<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timer</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 1.5rem;
  }
  #display {
    font-size: 3.5rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }
  .controls { display: flex; gap: 1rem; }
  button {
    font-size: 1.1rem;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
  }
  #startBtn { background: #16a34a; color: white; }
  #stopBtn { background: #dc2626; color: white; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { opacity: 0.7; font-size: 0.9rem; }
</style>
</head>
<body>
  <div id="display">00:00:00</div>
  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
  </div>
  <div id="status">Carregando...</div>

  <script>
    const display = document.getElementById("display");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function formatMs(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(totalSeconds % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function render(state) {
      display.textContent = formatMs(state.elapsedMs);
      startBtn.disabled = state.running;
      stopBtn.disabled = !state.running;
      statusEl.textContent = state.running ? "Rodando" : "Parado";
    }

    async function fetchStatus() {
      const res = await fetch("/api/timer/status");
      render(await res.json());
    }

    async function callAction(action) {
      const res = await fetch(`/api/timer/${action}`, { method: "POST" });
      render(await res.json());
    }

    startBtn.addEventListener("click", () => callAction("start"));
    stopBtn.addEventListener("click", () => callAction("stop"));

    fetchStatus();
    setInterval(fetchStatus, 1000);
  </script>
</body>
</html>
